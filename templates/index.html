<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.png') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>timetracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
        }
        .navbar {
            background-color: #2d2d2d !important;
            border-bottom: 1px solid #3a3a3a;
        }
        .navbar-brand, .navbar-text {
            color: #e0e0e0 !important;
        }
        .btn-outline-light {
            border-color: #4a4a4a;
            color: #e0e0e0;
        }
        .btn-outline-light:hover {
            background-color: #3a3a3a;
        }
        .btn-outline-secondary {
            border-color: #4a4a4a;
            color: #b0b0b0;
        }
        .btn-outline-secondary:hover {
            background-color: #3a3a3a;
            color: #fff;
        }
        .btn-outline-primary {
            border-color: #0d6efd;
            color: #0d6efd;
        }
        .btn-outline-primary:hover {
            background-color: #0d6efd;
            color: #fff;
        }
        .table {
            background-color: #2d2d2d;
            border-color: #3a3a3a;
            color: #e0e0e0;
        }
        .table th {
            background-color: #3a3a3a;
            border-color: #4a4a4a;
            color: #d0d0d0;
        }
        .table td {
            border-color: #3a3a3a;
            vertical-align: middle;
        }
        .table tbody tr:hover {
            background-color: #3d3d3d;
        }
        .activity-select {
            background-color: #3a3a3a;
            color: #e0e0e0;
            border: 1px solid #4a4a4a;
            border-radius: 4px;
            padding: 0.25rem 0.5rem;
            width: 100%;
        }
        .activity-select:focus {
            background-color: #4a4a4a;
            border-color: #6c757d;
        }
        .activity-select option {
            background-color: #2d2d2d;
            color: #e0e0e0;
        }
        .text-muted {
            color: #888888 !important;
        }
        .btn-group .btn {
            background-color: #2d2d2d;
            border-color: #3a3a3a;
            color: #d0d0d0;
        }
        .btn-group .btn:hover {
            background-color: #3a3a3a;
        }
        .btn-group .btn-outline-primary {
            background-color: #0d6efd;
            color: #fff;
            border-color: #0d6efd;
        }
        .btn-group .btn-outline-primary:hover {
            background-color: #0b5ed7;
        }
        @media (max-width: 576px) {
            .activity-select {
                font-size: 0.8rem;
                padding: 0.15rem 0.3rem;
            }
            .table th, .table td {
                padding: 0.3rem;
            }
            .btn-group .btn {
                font-size: 0.8rem;
                padding: 0.25rem 0.5rem;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <span class="navbar-brand">timetracker</span>
            <div class="d-flex">
                <span class="navbar-text me-3">{{ date.strftime('%d.%m.%Y') }}</span>
                <a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-sm">Выйти</a>
            </div>
        </div>
    </nav>

    <div class="container mt-3">
        <!-- Навигация по датам -->
        <div class="row mb-3">
            <div class="col-12">
                <div class="btn-group w-100" role="group">
                    <a href="{{ url_for('index', date=date - timedelta(days=1)) }}" class="btn btn-outline-secondary">&laquo; Предыдущий</a>
                    <a href="{{ url_for('index') }}" class="btn btn-outline-primary">Сегодня</a>
                    <a href="{{ url_for('index', date=date + timedelta(days=1)) }}" class="btn btn-outline-secondary">Следующий &raquo;</a>
                </div>
            </div>
        </div>

        <!-- Таблица -->
        <div class="table-responsive">
            <table class="table table-bordered table-hover align-middle">
                <thead>
                    <tr>
                        <th style="width: 80px;">Время</th>
                        <th>Активность</th>
                    </tr>
                </thead>
                <tbody>
                    {% for hour in hours_list %}
                    <tr>
                        <td class="text-center fw-bold">{{ hour }}</td>
                        <td>
                            <select class="activity-select form-select form-select-sm" data-hour="{{ hour }}">
                                <option value="">—</option>
                                {% for activity in activities %}
                                    <option value="{{ activity }}" {% if hours[hour] == activity %}selected{% endif %}>
                                        {{ activity }}
                                    </option>
                                {% endfor %}
                            </select>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <div class="text-muted small mt-2">
            <i>Изменения сохраняются автоматически при выборе активности.</i>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const selects = document.querySelectorAll('.activity-select');
            const currentDate = '{{ date.strftime("%Y-%m-%d") }}';

            selects.forEach(select => {
                select.addEventListener('change', function() {
                    const hour = this.dataset.hour;
                    const activity = this.value;

                    fetch('/update', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            date: currentDate,
                            hour: hour,
                            activity: activity
                        })
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (!data.success) {
                            alert('Ошибка сохранения: ' + (data.message || 'неизвестная ошибка'));
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert('Ошибка сети при сохранении');
                    });
                });
            });
        });
    </script>
</body>
</html>
